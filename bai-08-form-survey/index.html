```html
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Customer Survey</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #eeeeee;
        margin: 0;
        padding: 30px;
      }

      .container {
        width: 650px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px #bbb;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
      }

      .description {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 22px;
      }

      label.title {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: #333;
      }

      input[type="text"],
      input[type="email"],
      textarea,
      select {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }

      textarea {
        resize: vertical;
      }

      .options label {
        display: block;
        margin: 8px 0;
        font-weight: normal;
      }

      .inline-options label {
        display: inline-block;
        margin-right: 20px;
        font-weight: normal;
      }

      .required {
        color: red;
      }

      .submit-area {
        text-align: center;
        margin-top: 30px;
      }

      input[type="submit"],
      input[type="reset"] {
        padding: 10px 25px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
        margin: 5px;
      }

      input[type="submit"] {
        background-color: #4caf50;
        color: white;
      }

      input[type="reset"] {
        background-color: #777;
        color: white;
      }

      hr {
        border: none;
        border-top: 1px solid #ddd;
        margin: 25px 0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Customer Survey</h1>

      <p class="description">
        Please take a few minutes to complete this survey.
      </p>

      <form action="#" method="post">
        <!-- Thông tin khách hàng -->
        <div class="form-group">
          <label class="title" for="name">
            Name <span class="required">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
          />
        </div>

        <div class="form-group">
          <label class="title" for="email">
            Email <span class="required">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
          />
        </div>

        <hr />

        <!-- Đánh giá dịch vụ -->
        <div class="form-group">
          <label class="title"> How satisfied are you with our service? </label>

          <div class="options">
            <label>
              <input type="radio" name="satisfaction" value="very_satisfied" />
              Very satisfied
            </label>

            <label>
              <input type="radio" name="satisfaction" value="satisfied" />
              Satisfied
            </label>

            <label>
              <input type="radio" name="satisfaction" value="neutral" />
              Neutral
            </label>

            <label>
              <input type="radio" name="satisfaction" value="dissatisfied" />
              Dissatisfied
            </label>

            <label>
              <input
                type="radio"
                name="satisfaction"
                value="very_dissatisfied"
              />
              Very dissatisfied
            </label>
          </div>
        </div>

        <!-- Sản phẩm -->
        <div class="form-group">
          <label class="title"> Which products did you purchase? </label>

          <div class="options">
            <label>
              <input type="checkbox" name="product" value="product_a" />
              Product A
            </label>

            <label>
              <input type="checkbox" name="product" value="product_b" />
              Product B
            </label>

            <label>
              <input type="checkbox" name="product" value="product_c" />
              Product C
            </label>

            <label>
              <input type="checkbox" name="product" value="product_d" />
              Product D
            </label>
          </div>
        </div>

        <!-- Mức độ giới thiệu -->
        <div class="form-group">
          <label class="title">
            How likely are you to recommend us to others?
          </label>

          <select name="recommend">
            <option value="">-- Please select --</option>
            <option value="very_likely">Very likely</option>
            <option value="likely">Likely</option>
            <option value="neutral">Neutral</option>
            <option value="unlikely">Unlikely</option>
            <option value="very_unlikely">Very unlikely</option>
          </select>
        </div>

        <!-- Góp ý -->
        <div class="form-group">
          <label class="title" for="comments"> Additional comments </label>

          <textarea
            id="comments"
            name="comments"
            rows="5"
            placeholder="Enter your comments here"
          >
          </textarea>
        </div>

        <!-- Nút -->
        <div class="submit-area">
          <input type="submit" value="Submit" />
          <input type="reset" value="Reset" />
        </div>
      </form>
    </div>
  </body>
</html>
```
