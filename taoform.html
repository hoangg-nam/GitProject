```html
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Bài tập tạo form</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
      }

      .form-container {
        width: 500px;
        margin: 30px auto;
        background-color: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
      }

      h2 {
        text-align: center;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="email"],
      input[type="date"],
      textarea,
      select {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      textarea {
        resize: vertical;
      }

      .radio-group,
      .checkbox-group {
        margin-top: 5px;
      }

      .radio-group label,
      .checkbox-group label {
        display: inline;
        font-weight: normal;
        margin-right: 15px;
      }

      .buttons {
        text-align: center;
        margin-top: 20px;
      }

      input[type="submit"],
      input[type="reset"] {
        padding: 10px 20px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
      }

      input[type="submit"] {
        background-color: #4caf50;
        color: white;
      }

      input[type="reset"] {
        background-color: #f44336;
        color: white;
      }

      hr {
        margin: 40px 0;
        border: none;
        border-top: 1px solid #ddd;
      }
    </style>
  </head>

  <body>
    <!-- PHẦN 1 -->
    <div class="form-container">
      <h2>Thông tin cá nhân</h2>

      <form action="#" method="post">
        <div class="form-group">
          <label>Họ và tên:</label>
          <input type="text" name="yourname" />
        </div>

        <div class="form-group">
          <label>Email:</label>
          <input type="email" name="email" />
        </div>

        <div class="form-group">
          <label>Sở thích:</label>

          <div class="checkbox-group">
            <input type="checkbox" name="hobby" value="reading" />
            <label>Đọc sách</label>

            <input type="checkbox" name="hobby" value="music" />
            <label>Nghe nhạc</label>

            <input type="checkbox" name="hobby" value="sport" />
            <label>Thể thao</label>
          </div>
        </div>

        <div class="buttons">
          <input type="submit" value="Gửi thông tin" />
          <input type="reset" value="Nhập lại" />
        </div>
      </form>
    </div>

    <!-- PHẦN 2 -->
    <div class="form-container">
      <h2>Đăng ký học viên</h2>

      <form action="#" method="post">
        <div class="form-group">
          <label>Họ và tên:</label>
          <input type="text" name="fullname" />
        </div>

        <div class="form-group">
          <label>Email:</label>
          <input type="email" name="email" />
        </div>

        <div class="form-group">
          <label>Số điện thoại:</label>
          <input type="text" name="phone" />
        </div>

        <div class="form-group">
          <label>Ngày sinh:</label>
          <input type="date" name="birthday" />
        </div>

        <div class="form-group">
          <label>Giới tính:</label>

          <div class="radio-group">
            <input type="radio" name="gender" value="male" />
            <label>Nam</label>

            <input type="radio" name="gender" value="female" />
            <label>Nữ</label>

            <input type="radio" name="gender" value="other" />
            <label>Khác</label>
          </div>
        </div>

        <div class="form-group">
          <label>Địa chỉ:</label>
          <textarea name="address" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>Khóa học:</label>

          <select name="course">
            <option value="html-css">HTML & CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
          </select>
        </div>

        <div class="form-group">
          <label>Hình thức học:</label>

          <div class="radio-group">
            <input type="radio" name="study_type" value="online" />
            <label>Online</label>

            <input type="radio" name="study_type" value="offline" />
            <label>Offline</label>
          </div>
        </div>

        <div class="form-group">
          <label>Sở thích:</label>

          <div class="checkbox-group">
            <input type="checkbox" name="hobby" value="reading" />
            <label>Đọc sách</label>

            <input type="checkbox" name="hobby" value="music" />
            <label>Nghe nhạc</label>

            <input type="checkbox" name="hobby" value="sport" />
            <label>Thể thao</label>
          </div>
        </div>

        <div class="form-group">
          <label>Ghi chú:</label>
          <textarea name="note" rows="4"></textarea>
        </div>

        <div class="buttons">
          <input type="submit" value="Đăng ký" />
          <input type="reset" value="Nhập lại" />
        </div>
      </form>
    </div>
  </body>
</html>
```
